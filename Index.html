<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f4f8;min-height:100vh;padding-bottom:80px}
input,select,textarea,button{font-family:inherit}
.hdr{background:#6366f1;color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.hdr h1{font-size:17px;font-weight:700}
.hdr p{font-size:11px;opacity:.7;margin-bottom:10px}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;color:rgba(255,255,255,.7);border:none;border-radius:8px 8px 0 0;padding:8px 12px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;position:relative;flex-shrink:0}
.tab.active{background:#fff;color:#6366f1}
.nb{position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:800}
.pg{padding:14px;max-width:520px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px}
.sl{font-weight:700;font-size:15px;margin-bottom:12px;color:#1e1e2e}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
label{font-size:12px;color:#555;font-weight:600}
input,select,textarea{padding:9px 11px;border-radius:8px;border:1px solid #ddd;font-size:14px;outline:none;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%;color:#fff;margin-top:4px}
.bp{background:#6366f1}.bg{background:#10b981}.bb{background:#3b82f6}.br{background:#ef4444}.bgy{background:#888}
.bsm{padding:5px 10px;font-size:12px;width:auto;border-radius:6px;margin-top:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;margin:2px 2px 0 0}
.al{border-radius:12px;padding:13px;margin-bottom:12px;font-size:13px}
.alr{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
.aly{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.pb{background:#f0f0f0;border-radius:20px;height:12px;overflow:hidden;margin:8px 0 4px}
.pf{height:100%;border-radius:20px;transition:width .5s}
.fr{display:flex;gap:8px}
.si{position:fixed;bottom:20px;right:16px;background:#10b981;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.mb{background:#f0f0f0;border-radius:20px;height:6px;margin-top:5px}
.mf{height:100%;border-radius:20px;transition:width .4s}
.it{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.it th{background:#f4f4f8;padding:6px 8px;text-align:left;font-size:12px;color:#555}
.it td{padding:7px 8px;border-bottom:1px solid #f0f0f0}
canvas{max-width:100%;border-radius:8px}

/* ===== UI Refresh ===== */
:root{--primary:#4f46e5;--primary2:#7c3aed;--ink:#17172a;--muted:#6b7280;--line:#e7e7ef;--surface:#fff;--bg:#f7f7fb;--success:#059669;--danger:#dc2626;--warning:#d97706}
html{background:var(--bg)}
body{background:radial-gradient(circle at 100% 0,#eef2ff 0,transparent 32%),var(--bg);color:var(--ink);padding-bottom:40px}
.hdr{background:rgba(79,70,229,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 18px 0;box-shadow:0 8px 24px rgba(67,56,202,.18)}
.hdr h1{font-size:19px;letter-spacing:-.3px}.hdr p{font-size:11px;opacity:.78;margin:2px 0 12px}
.tabs{gap:6px;padding-bottom:0}.tab{padding:9px 13px;border-radius:10px 10px 0 0;font-size:12px;transition:.18s ease}.tab:hover{background:rgba(255,255,255,.12);color:#fff}.tab.active{background:#fff;color:var(--primary);box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.pg{padding:18px 14px 30px;max-width:760px}.card{border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:17px;box-shadow:0 5px 18px rgba(15,23,42,.055);margin-bottom:14px;transition:transform .18s ease,box-shadow .18s ease}.card:hover{box-shadow:0 8px 24px rgba(15,23,42,.08)}
.sl{font-size:15px;color:var(--ink);letter-spacing:-.15px;margin-bottom:13px}
.g2{gap:12px;margin-bottom:10px}.g2 .card{margin-bottom:0}
label{font-size:11px;color:var(--muted);letter-spacing:.15px;text-transform:uppercase}input,select,textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfbfd;color:var(--ink);transition:.15s}input:hover,select:hover,textarea:hover{border-color:#c7c7d6}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.10);background:#fff}
.btn{border-radius:10px;padding:11px 15px;font-size:13px;box-shadow:0 2px 5px rgba(15,23,42,.08);transition:transform .12s,box-shadow .12s,filter .12s}.btn:hover{filter:brightness(.98);box-shadow:0 4px 10px rgba(15,23,42,.12)}.btn:active{transform:translateY(1px)}
.bp{background:linear-gradient(135deg,var(--primary),var(--primary2))}.bg{background:linear-gradient(135deg,#059669,#10b981)}.bb{background:#2563eb}.br{background:#dc2626}.bgy{background:#64748b}
.row{padding:12px 2px;border-bottom:1px solid #f0f0f5}.tag{padding:4px 9px;font-size:10px}
.al{border-radius:14px;padding:13px 14px;box-shadow:0 2px 8px rgba(15,23,42,.035)}
.mb{height:7px;background:#ececf3}.it{font-size:12px}.it th{background:#f7f7fb;padding:9px 8px}.it td{padding:9px 8px}
/* Dashboard hero and stat cards */
.pg>.card[style*="linear-gradient"]{border:0!important;border-radius:18px!important;box-shadow:0 10px 25px rgba(79,70,229,.20)!important;padding:20px!important}
.pg>.card[style*="linear-gradient"] div:nth-child(2){font-size:32px!important;letter-spacing:-1px}
.pg>.g2>.card{min-height:91px;padding:14px;border-left-width:4px!important}
.pg>.g2>.card>div:nth-child(2){font-size:21px!important;letter-spacing:-.4px}
canvas{background:#fff;padding:8px;border:1px solid rgba(15,23,42,.05);box-shadow:0 5px 18px rgba(15,23,42,.04)}
@media(max-width:560px){.hdr{padding-left:13px;padding-right:13px}.pg{padding:13px 11px 24px}.g2{gap:9px}.card{padding:14px;border-radius:14px}.g2 .card{min-height:84px}.g2 .card>div:nth-child(2){font-size:18px!important}.fr{gap:7px}.btn{padding:10px 12px}.tabs{overflow-x:auto;padding-right:4px}.tab{padding:8px 10px}}
@media(min-width:700px){.pg>.g2{grid-template-columns:repeat(4,1fr)}.pg>.g2>.card:first-child,.pg>.g2>.card:nth-child(2){grid-column:span 2}}

.auth-screen{position:fixed;inset:0;z-index:10000;background:linear-gradient(135deg,#eef2ff,#f8fafc);display:flex;align-items:center;justify-content:center;padding:20px}.auth-card{width:min(420px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.12)}.auth-logo{width:58px;height:58px;border-radius:16px;background:#eef2ff;display:grid;place-items:center;font-size:30px;margin-bottom:16px}.auth-card h2{font-size:24px;letter-spacing:-.5px}.auth-sub{color:#64748b;font-size:13px;margin:7px 0 20px}.auth-alert{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:12px;font-size:12px;line-height:1.5;margin-bottom:14px}.auth-msg{font-size:12px;margin-top:10px;text-align:center;color:#64748b;min-height:18px}.auth-card .btn{margin-top:7px}.userbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:7px 14px;background:#fff;border-bottom:1px solid #e5e7eb;font-size:11px;color:#64748b}.userbar button{border:1px solid #ddd;border-radius:8px;background:#fff;padding:5px 9px;font-size:11px;cursor:pointer}.sync-dot{width:7px;height:7px;border-radius:50%;background:#10b981;display:inline-block}.sync-dot.off{background:#f59e0b}
</style>

<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🥤</div>
    <h2>Soft Drink Manager</h2>
    <p class="auth-sub">Sign in to sync your business data across devices.</p>
    <div id="authSetup" class="auth-alert" style="display:none"></div>
    <div id="authForm">
      <div class="fg"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="fg"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Minimum 6 characters"></div>
      <button class="btn bp" id="signInBtn" onclick="signIn()">Sign In</button>
      <button class="btn bb" id="signUpBtn" onclick="signUp()">Create Account</button>
      <div id="authMsg" class="auth-msg"></div>
    </div>
  </div>
</div>
<div id="userbar" class="userbar"></div>
<div class="hdr">
  <h1>🥤 Soft Drink Manager</h1>
  <p>200ml Cup Production</p>
  <div class="tabs" id="tabs"></div>
</div>
<div class="pg" id="pg"></div>
<div class="si" id="si">✓ Saved</div>
<script>
var TABS=["Dashboard","Production","Sales","Payments","Materials","Expenses","Targets","Charts","Invoice","Report","Retailers","Import"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var ECATS=["Electricity","Transport","Wages","Rent","Maintenance","Packaging Purchase","Raw Materials","Other"];

function td(){var d=new Date();var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+day;}
function fmt(n){return "Rs."+Number(n||0).toFixed(2);}
function el(id){return document.getElementById(id);}
function isOD(d){return d&&new Date(d)<new Date(td());}
function tag(label,color){return '<span class="tag" style="background:'+color+'22;color:'+color+'">'+label+'</span>';}
function diff(a,b){return b===0?null:(((a-b)/b)*100).toFixed(1);}
function arH(v){if(v===null)return "";return Number(v)>=0?'<span style="color:#10b981;font-size:11px;margin-left:4px">▲'+Math.abs(v)+'%</span>':'<span style="color:#ef4444;font-size:11px;margin-left:4px">▼'+Math.abs(v)+'%</span>';}

var S={
  production:[],sales:[],payments:[],expenses:[],
  retailers:[{id:1,name:"Shop A",contact:"",address:"",notes:""},{id:2,name:"Shop B",contact:"",address:"",notes:""}],
  materials:[
    {id:1,name:"Sugar",unit:"kg",stock:50,minStock:10,costPerUnit:40},
    {id:2,name:"Concentrate",unit:"L",stock:20,minStock:5,costPerUnit:150},
    {id:3,name:"Cups (200ml)",unit:"pcs",stock:1000,minStock:200,costPerUnit:0.8},
    {id:4,name:"Lids",unit:"pcs",stock:1000,minStock:200,costPerUnit:0.3},
    {id:5,name:"Straws",unit:"pcs",stock:1000,minStock:200,costPerUnit:0.2}
  ],
  costs:{ingredients:2.5,packaging:1.0,labor:0.5},
  targets:{dailyCups:0,dailyRevenue:0,monthlyCups:0,monthlyRevenue:0},
  bizName:"My Soft Drink Co.",
  tab:"Dashboard",
  reportMonth:new Date().getMonth(),
  reportYear:new Date().getFullYear(),
  editingRetailer:null,
  editingSale:null,
  editingMaterial:null,
  invoiceSaleId:"",
  pForm:{date:td(),batch:"",cups:"",notes:""},
  sForm:{date:td(),retailer:"",cups:"",price:"",dueDate:"",paid:""},
  payForm:{saleId:"",amount:"",date:td(),note:""},
  rForm:{name:"",contact:"",address:"",notes:""},
  mForm:{name:"",unit:"kg",stock:"",minStock:"",costPerUnit:""},
  eForm:{date:td(),category:"Electricity",amount:"",note:""}
};

var sbClient=null;
var currentUser=null;
var saveTimer=null;
var isRemoteReady=false;

function getSnapshot(){return {production:S.production,sales:S.sales,payments:S.payments,expenses:S.expenses,retailers:S.retailers,materials:S.materials,costs:S.costs,targets:S.targets,bizName:S.bizName};}

async function save(){
  try{
    localStorage.setItem("sdm2",JSON.stringify(getSnapshot()));
    var i=el("si");if(i){i.textContent="✓ Saved locally";i.style.opacity="1";setTimeout(function(){i.style.opacity="0";},1200);}
    if(!sbClient||!currentUser||!isRemoteReady)return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async function(){
      var payload={user_id:currentUser.id,data:getSnapshot(),updated_at:new Date().toISOString()};
      var r=await sbClient.from("app_data").upsert(payload,{onConflict:"user_id"});
      if(r.error) console.error("Cloud save failed",r.error);
      else if(i){i.textContent="✓ Synced";i.style.opacity="1";setTimeout(function(){i.style.opacity="0";},1200);}
    },250);
  }catch(e){console.error(e);}
}

function applySnapshot(d){if(!d)return;Object.keys(d).forEach(function(k){if(k in S)S[k]=d[k];});}

async function load(){
  try{
    var local=localStorage.getItem("sdm2");
    if(local)applySnapshot(JSON.parse(local));
  }catch(e){}
}

function showAuthMessage(msg,error){var x=el("authMsg");if(x){x.textContent=msg;x.style.color=error?"#dc2626":"#64748b";}}
function setAuthBusy(b){["signInBtn","signUpBtn"].forEach(function(id){var x=el(id);if(x)x.disabled=b;});}

async function signIn(){
  if(!sbClient)return;
  var email=el("authEmail").value.trim(),password=el("authPassword").value;
  if(!email||!password){showAuthMessage("Enter your email and password.",true);return;}
  setAuthBusy(true);showAuthMessage("Signing in…");
  var r=await sbClient.auth.signInWithPassword({email:email,password:password});
  if(r.error)showAuthMessage(r.error.message,true);else await startApp(r.data.user);
  setAuthBusy(false);
}

async function signUp(){
  if(!sbClient)return;
  var email=el("authEmail").value.trim(),password=el("authPassword").value;
  if(!email||password.length<6){showAuthMessage("Use a valid email and a password of at least 6 characters.",true);return;}
  setAuthBusy(true);showAuthMessage("Creating account…");
  var r=await sbClient.auth.signUp({email:email,password:password});
  if(r.error)showAuthMessage(r.error.message,true);
  else if(r.data.session) await startApp(r.data.user);
  else showAuthMessage("Account created. Check your email to confirm, then sign in.");
  setAuthBusy(false);
}

async function signOut(){if(!sbClient)return;await sbClient.auth.signOut();location.reload();}

async function startApp(user){
  currentUser=user;
  var auth=el("authScreen");if(auth)auth.style.display="none";
  var ub=el("userbar");if(ub)ub.innerHTML='<span><span class="sync-dot"></span> '+(user.email||"Signed in")+'</span><button onclick="signOut()">Sign out</button>';
  if(sbClient){
    var r=await sbClient.from("app_data").select("data").eq("user_id",user.id).maybeSingle();
    if(!r.error&&r.data&&r.data.data){applySnapshot(r.data.data);localStorage.setItem("sdm2",JSON.stringify(getSnapshot()));}
    isRemoteReady=true;
  }
  render();
}

async function initCloud(){
  var SUPABASE_URL="https://nqipjmhmuymxphfdiaoo.supabase.co";
  var SUPABASE_ANON_KEY="sb_publishable_2N8KzFVdCnZ4AjY8dH-T7Q_VADzXrfI";
  var setup=el("authSetup");
  if(SUPABASE_URL.indexOf("YOUR_")===0||SUPABASE_ANON_KEY.indexOf("YOUR_")===0){
    if(setup){setup.style.display="block";setup.innerHTML='<b>Setup required.</b><br>Open this HTML file in a text editor and replace <code>your Supabase project URL and publishable key with your Supabase project values.';}
    return;
  }
  sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var r=await sbClient.auth.getSession();
  if(r.data.session)await startApp(r.data.session.user);
  else {var a=el("authScreen");if(a)a.style.display="flex";}
}

function pFS(sid){return S.payments.filter(function(p){return p.saleId===sid;}).reduce(function(a,p){return a+Number(p.amount);},0);}
function sTotal(s){return Number(s.cups)*Number(s.price);}
function sPend(s){return Math.max(0,sTotal(s)-pFS(s.id));}

function getStats(){
  var tp=S.production.reduce(function(a,b){return a+Number(b.cups);},0);
  var ts=S.sales.reduce(function(a,b){return a+Number(b.cups);},0);
  var tr=S.sales.reduce(function(a,b){return a+sTotal(b);},0);
  var cpu=Object.values(S.costs).reduce(function(a,b){return a+Number(b);},0);
  var tc=ts*cpu,tp2=tr-tc;
  var stk=tp-ts;
  var col=S.payments.reduce(function(a,p){return a+Number(p.amount);},0);
  var pend=S.sales.reduce(function(a,s){return a+sPend(s);},0);
  var od=S.sales.filter(function(s){return sPend(s)>0&&isOD(s.dueDate);});
  var exp=S.expenses.reduce(function(a,e){return a+Number(e.amount);},0);
  return {tp:tp,ts:ts,tr:tr,cpu:cpu,tc:tc,tp2:tp2,stk:stk,col:col,pend:pend,od:od,exp:exp};
}

function getMonthStats(m,y){
  function inM(d){var x=new Date(d);return x.getMonth()===m&&x.getFullYear()===y;}
  var rP=S.production.filter(function(p){return inM(p.date);});
  var rS=S.sales.filter(function(s){return inM(s.date);});
  var rPay=S.payments.filter(function(p){return inM(p.date);});
  var rE=S.expenses.filter(function(e){return inM(e.date);});
  var cups=rP.reduce(function(a,p){return a+Number(p.cups);},0);
  var sold=rS.reduce(function(a,s){return a+Number(s.cups);},0);
  var rev=rS.reduce(function(a,s){return a+sTotal(s);},0);
  var col=rPay.reduce(function(a,p){return a+Number(p.amount);},0);
  var pend=rS.reduce(function(a,s){return a+sPend(s);},0);
  var cpu=Object.values(S.costs).reduce(function(a,b){return a+Number(b);},0);
  var cost=sold*cpu;
  var exp=rE.reduce(function(a,e){return a+Number(e.amount);},0);
  var profit=rev-cost-exp;
  var retMap={};
  rS.forEach(function(s){
    var k=s.retailer||"Unknown";
    if(!retMap[k])retMap[k]={cups:0,revenue:0,pending:0};
    retMap[k].cups+=Number(s.cups);retMap[k].revenue+=sTotal(s);retMap[k].pending+=sPend(s);
  });
  var expMap={};
  rE.forEach(function(e){if(!expMap[e.category])expMap[e.category]=0;expMap[e.category]+=Number(e.amount);});
  return {cups:cups,sold:sold,rev:rev,col:col,pend:pend,cost:cost,exp:exp,profit:profit,retMap:retMap,expMap:expMap,production:rP};
}

function rSum(){
  var map={};
  S.sales.forEach(function(s){
    var k=s.retailer||"Unknown";
    if(!map[k])map[k]={cups:0,revenue:0,pending:0};
    map[k].cups+=Number(s.cups);map[k].revenue+=sTotal(s);map[k].pending+=sPend(s);
  });
  return map;
}

function sCard(label,value,sub,color){
  return '<div class="card" style="border-left:4px solid '+color+'"><div style="font-size:11px;color:#888;margin-bottom:3px">'+label+'</div><div style="font-size:20px;font-weight:700;color:#1e1e2e">'+value+'</div>'+(sub?'<div style="font-size:11px;color:#aaa;margin-top:2px">'+sub+'</div>':'')+'</div>';
}

function render(){
  renderTabs();
  var t=S.tab;
  if(t==="Dashboard")rDash();
  else if(t==="Production")rProd();
  else if(t==="Sales")rSales();
  else if(t==="Payments")rPay();
  else if(t==="Materials")rMats();
  else if(t==="Expenses")rExp();
  else if(t==="Targets")rTgt();
  else if(t==="Charts")rCharts();
  else if(t==="Invoice")rInv();
  else if(t==="Report")rReport();
  else if(t==="Retailers")rRet();
  else if(t==="Import")rImport();
}

function renderTabs(){
  var st=getStats();
  var low=S.materials.filter(function(m){return Number(m.stock)<=Number(m.minStock);}).length;
  var html="";
  TABS.forEach(function(t){
    var nb="";
    if(t==="Payments"&&st.od.length>0)nb='<span class="nb">'+st.od.length+'</span>';
    if(t==="Materials"&&low>0)nb='<span class="nb">'+low+'</span>';
    html+='<button class="tab'+(S.tab===t?" active":"\"")+(S.tab===t?'"':"")+' onclick="setTab(\''+t+'\')">'+t+nb+'</button>';
  });
  el("tabs").innerHTML=html;
}

function setTab(t){S.tab=t;render();}

// DASHBOARD
function rDash(){
  var st=getStats();
  var today=td();
  var tSales=S.sales.filter(function(s){return s.date===today;});
  var tRev=tSales.reduce(function(a,s){return a+sTotal(s);},0);
  var tCups=tSales.reduce(function(a,s){return a+Number(s.cups);},0);
  var lm=S.materials.filter(function(m){return Number(m.stock)<=Number(m.minStock);});
  var h="";

function addSale(){

  var id=Date.now();

  if(Number(paid)>0)S.payments.unshift({id:Date.now()+1,saleId:id,retailer:retailer,amount:Number(paid),date:date,note:"Upfront"});
  if(!S.retailers.find(function(r){return r.name===retailer;}))S.retailers.push({id:Date.now()+2,name:retailer,contact:"",address:"",notes:""});
  S.sForm={date:date,retailer:retailer,cups:"",price:price,dueDate:"",paid:""};
  save();render();
}
function editSale(id){
  var s=S.sales.find(function(x){return x.id===id;});
  S.editingSale=id;
  S.sForm={date:s.date,retailer:s.retailer,cups:s.cups,price:s.price,dueDate:s.dueDate||"",paid:s.paid||""};

}
function updSale(){
  var cups=el("sC").value,price=el("sP").value,date=el("sD").value,retailer=el("sR").value,dueDate=el("sDu").value;

  S.sales=S.sales.map(function(s){return s.id===S.editingSale?Object.assign({},s,{date:date,retailer:retailer,cups:cups,price:price,dueDate:dueDate}):s;});
  S.editingSale=null;
  S.sForm={date:td(),retailer:"",cups:"",price:"",dueDate:"",paid:""};
  save();render();
}
function delSale(){

  var id=S.editingSale;
  S.payments=S.payments.filter(function(p){return p.saleId!==id;});
  S.sales=S.sales.filter(function(s){return s.id!==id;});

  S.sForm={date:td(),retailer:"",cups:"",price:"",dueDate:"",paid:""};

}

function addPmt(){
  var saleId=el("pSl").value,amount=el("pAm").value,date=el("pDt").value,note=el("pNt").value;
  if(!saleId||!amount)return;
  var sale=S.sales.find(function(s){return s.id===Number(saleId);});
  var pending=s? sPend(sale):0;

  S.payments.unshift({id:Date.now(),saleId:Number(saleId),retailer:sale?sale.retailer:"",amount:payAmount,date:date,note:note});
  S.payForm={saleId:"",amount:"",date:td(),note:""};
  save();render();
}

// TARGETS
function rTgt(){
  var now=new Date();
  var ts=S.sales.filter(function(s){return s.date===td();});
  var tC=ts.reduce(function(a,s){return a+Number(s.cups);},0);
  var tR=ts.reduce(function(a,s){return a+sTotal(s);},0);
  var ms=getMonthStats(now.getMonth(),now.getFullYear());
  var t=S.targets;
  function tb(label,cur,tgt,color,unit){
    var pct=tgt>0?Math.min(100,(cur/tgt)*100):0;
    var st=pct>=100?"🎯 Target hit!":pct>=75?"Almost there!":pct>=50?"Halfway!":"Keep going!";
    var cv=unit==="Rs."?fmt(cur):cur+unit;
    var tv=unit==="Rs."?fmt(tgt):tgt+unit;
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:14px">'+label+'</b><span style="font-size:13px;color:'+color+';font-weight:700">'+cv+' / '+tv+'</span></div><div class="pb"><div class="pf" style="background:'+(pct>=100?"#10b981":color)+';width:'+pct+'%"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px"><span style="color:#aaa">'+pct.toFixed(0)+'% achieved</span><span style="color:'+(pct>=100?"#10b981":"#888")+'">'+st+'</span></div></div>';
  }
  var h='<div class="card"><div class="sl">Set Targets</div><div class="g2"><div class="fg"><label>Daily Target (cups)</label><input type="number" id="tDC" value="'+t.dailyCups+'" onchange="updTgt(\'dailyCups\',this.value)"></div><div class="fg"><label>Daily Target (Rs.)</label><input type="number" id="tDR" value="'+t.dailyRevenue+'" onchange="updTgt(\'dailyRevenue\',this.value)"></div><div class="fg"><label>Monthly Target (cups)</label><input type="number" id="tMC" value="'+t.monthlyCups+'" onchange="updTgt(\'monthlyCups\',this.value)"></div><div class="fg"><label>Monthly Target (Rs.)</label><input type="number" id="tMR" value="'+t.monthlyRevenue+'" onchange="updTgt(\'monthlyRevenue\',this.value)"></div></div></div>';
  h+='<div class="sl" style="padding:0 0 8px">📅 Today — '+td()+'</div>';
  if(Number(t.dailyCups)>0)h+=tb("Daily Cups",tC,Number(t.dailyCups),"#6366f1"," cups");
  if(Number(t.dailyRevenue)>0)h+=tb("Daily Revenue",tR,Number(t.dailyRevenue),"#10b981","Rs.");
  h+='<div class="sl" style="padding:8px 0">📆 This Month — '+MONTHS[now.getMonth()]+'</div>';
  if(Number(t.monthlyCups)>0)h+=tb("Monthly Cups",ms.sold,Number(t.monthlyCups),"#6366f1"," cups");
  if(Number(t.monthlyRevenue)>0)h+=tb("Monthly Revenue",ms.rev,Number(t.monthlyRevenue),"#10b981","Rs.");
  if(!Number(t.dailyCups)&&!Number(t.dailyRevenue)&&!Number(t.monthlyCups)&&!Number(t.monthlyRevenue))h+='<div class="al aly">Set your targets above to see progress!</div>';
  el("pg").innerHTML=h;
}

var impData=null;
function parseImportNotes(text){
  var lines=text.split(/\\r?\\n/).map(function(x){return x.trim();}).filter(Boolean);
  var year=new Date().getFullYear(), currentDate=td(), date=currentDate;
  var production=[],sales=[],expenses=[];
  function normDate(raw){
    if(!raw)return currentDate;
    var x=raw.trim().replace(/[,]/g,"");
    var m=x.match(/^(\\d{1,2})[\\/\\-](\\d{1,2})(?:[\\/\\-](\\d{2,4}))?$/);
    if(m){var yy=m[3]?Number(m[3]):year;if(yy<100)yy+=2000;return yy+"-"+String(Number(m[2])).padStart(2,"0")+"-"+String(Number(m[1])).padStart(2,"0");}
    var n=x.match(/^(\\d{1,2})\\s+([A-Za-z]+)(?:\\s+(\\d{4}))?$/);
    if(n){var months={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};var mm=months[n[2].toLowerCase()];if(mm)return (n[3]||year)+"-"+String(mm).padStart(2,"0")+"-"+String(Number(n[1])).padStart(2,"0");}
    return currentDate;
  }
  lines.forEach(function(line){
    var dm=line.match(/^(?:date\\s*[:=-]?\\s*)?(\\d{1,2}[\\s\\/\\-]+[A-Za-z0-9]+(?:[\\s\\/\\-]+\\d{2,4})?)$/i);
    if(dm){date=normDate(dm[1]);return;}
    var prod=line.match(/^(?:production|produced|batch)\\s*[:=-]\\s*(\\d+)\\s*(?:cups?)?/i);
    if(prod){production.push({date:date,cups:Number(prod[1]),batch:"",notes:line});return;}
    var exp=line.match(/^(?:expense|expenses)\\s*[:=-]\\s*([^:=-]+?)\\s*[-:=]\\s*rs?\\.?\\s*([\\d,.]+)/i);
    if(exp){expenses.push({date:date,category:exp[1].trim(),amount:Number(exp[2].replace(/,/g,"")),note:"Imported"});return;}
    var sale=line.replace(/^[-*•]\\s*/,"").replace(/^\\[v\\]\\s*/i,"");
    var sm=sale.match(/^(.+?)\\s*[-–—:]\\s*(\\d+)(?:\\s*\\(([^)]*)\\))?\\s*$/);
    if(sm){
      var retailer=sm[1].trim(),cups=Number(sm[2]),note=(sm[3]||"").toLowerCase();
      var paid=0;
      sales.push({date:date,retailer:retailer,cups:cups,price:0,dueDate:"",paid:paid,_paidHint:/paid|clear|settled/.test(note)});
    }
  });
  return {production:production,sales:sales,expenses:expenses,costs:null};
}
function runImp(){
  var text=el("nA").value.trim();if(!text)return;
  el("iB").textContent="⏳ Analysing...";el("iB").disabled=true;el("iMsg").textContent="";
  try{
    impData=parseImportNotes(text);
    var p=impData.production.length,s=impData.sales.length,ex=impData.expenses.length;
    var ph='<div class="card"><div class="sl">✅ Review Before Importing</div><div style="font-size:13px;color:#555;margin-bottom:8px"><b>Production:</b> '+p+' &nbsp;|&nbsp; <b>Sales:</b> '+s+' &nbsp;|&nbsp; <b>Expenses:</b> '+ex+'</div>';
    if(s)ph+=impData.sales.slice(0,10).map(function(x){return '<div style="font-size:12px;color:#888;padding:3px 0">💰 '+x.date+' — '+x.retailer+': '+x.cups+' cups'+(x._paidHint?' · marked paid':' · credit')+'</div>';}).join("");
    if(s)ph+='<div style="font-size:12px;color:#f59e0b;margin-top:6px">⚠️ Prices default to Rs.0 because the notes do not contain a price. Update them in Sales.</div>';
    ph+='<div class="fr" style="margin-top:14px"><button class="btn bg" style="flex:1" onclick="applyImp()">✅ Apply</button><button class="btn br" style="flex:1" onclick="discImp()">❌ Discard</button></div></div>';
    el("iPrev").innerHTML=ph;
  }catch(e){el("iMsg").innerHTML='<span style="color:#ef4444">Could not parse the notes. Check the format and try again.</span>';}
  el("iB").textContent="✨ Smart Import";el("iB").disabled=false;
}
function applyImp(){
  if(!impData)return;
  var ns=[],np=[];
  if(impData.production&&impData.production.length)S.production=impData.production.map(function(x,i){return Object.assign({id:Date.now()+i},x);}).concat(S.production);
  if(impData.sales&&impData.sales.length){
    impData.sales.forEach(function(x,i){
      var id=Date.now()+i+1000;
      var sale=Object.assign({id:id},x);delete sale._paidHint;
      ns.push(sale);
      if(Number(x.paid)>0)np.push({id:Date.now()+i+2000,saleId:id,retailer:x.retailer,amount:Number(x.paid),date:x.date,note:"Imported"});
      if(!S.retailers.find(function(r){return r.name===x.retailer;}))S.retailers.push({id:Date.now()+i+4000,name:x.retailer,contact:"",address:"",notes:""});
    });
    S.sales=ns.concat(S.sales);S.payments=np.concat(S.payments);
  }
  if(impData.expenses&&impData.expenses.length)S.expenses=impData.expenses.map(function(x,i){return Object.assign({id:Date.now()+i+3000},x);}).concat(S.expenses);
  if(impData.costs)S.costs=impData.costs;
  impData=null;save();setTab("Dashboard");
}
function discImp(){impData=null;el("iPrev").innerHTML="";}

load().then(initCloud);
</script>
